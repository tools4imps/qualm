name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # go.mod names the oldest Go qualm supports. "stable" is what releases are built with.
        go: ["1.24", "stable"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      # The suite includes the Contract coverage test, which fails while any
      # obligation in contract/ has no test naming it.
      - name: Test suite
        run: go test -race ./...

      - name: Contract coverage
        run: go test -v -run TestEveryObligationIsNamedByATest ./internal/contractcheck/ | grep 'contract coverage'

  # The release builds a gem per platform around the Go binary. Building them here means a broken
  # gemspec or a lost executable bit fails a pull request, not a release.
  gem:
    name: The gem builds and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      - name: Build the gems and the archives
        run: rake release:build

      - name: The built gem installs and runs
        run: |
          version=$(rake release:version)
          export GEM_HOME="$(mktemp -d)"
          gem install --local --no-document "pkg/qualm-$version-x86_64-linux.gem"
          test "$("$GEM_HOME/bin/qualm" --version)" = "qualm $version"

  # qualm holds itself to its own gate. This needs a key, so it only runs where
  # the repository's secret is available, which leaves out pull requests from forks.
  self:
    name: qualm on qualm
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        run: go build -o qualm ./cmd/qualm

      - name: qualm
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "No OPENROUTER_API_KEY secret here, so the list of files is shown and nothing is sent."
            ./qualm --dry-run --base "origin/${{ github.base_ref }}"
          else
            ./qualm --base "origin/${{ github.base_ref }}"
          fi
